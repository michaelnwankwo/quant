[pytest]
# ---------------------------------------------------------------------------
# quant_system test configuration
# ---------------------------------------------------------------------------
testpaths = tests

# ``verify_system.py`` is the end-to-end pipeline verification suite. It is not
# named ``test_*`` because it doubles as a standalone CLI entry point, so it has
# to be registered explicitly here to be collected by pytest.
python_files = test_*.py verify_system.py
python_classes = Test*
python_functions = test_*

# Acceptance criterion: the suite must run clean. Any warning - including
# DeprecationWarnings from our own use of pandas/numpy - is treated as an error.
filterwarnings =
    error
    # hmmlearn emits this from inside its EM loop on short/degenerate windows;
    # it is informational and not actionable from our side.
    ignore:Model is not converging:UserWarning
    # matplotlib opens a figure with a non-interactive backend in headless CI.
    ignore:FigureCanvasAgg is non-interactive:UserWarning

# Fail fast on the first failing test? No - report everything, then summarise.
addopts =
    -ra
    --strict-markers
    --tb=short
